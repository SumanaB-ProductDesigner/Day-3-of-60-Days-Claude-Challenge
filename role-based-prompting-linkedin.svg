  <text x="540" y="962" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#3D2B1F">ABTALKS</text>
  <text x="540" y="990" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8B5E3C">60-Day Claude AI Mastery Challenge · Series</text>
