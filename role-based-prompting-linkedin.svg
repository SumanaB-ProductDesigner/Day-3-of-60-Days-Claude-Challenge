    <text x="342.5" y="815" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#3D2B1F">Manager</text>
    <text x="342.5" y="838" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8B5E3C">Strategy</text>
