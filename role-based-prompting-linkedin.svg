  <text x="540" y="81" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#F7F1E6">ABTALKS 60-DAY CLAUDE AI MASTERY CHALLENGE</text>

  <!-- Title -->
  <text x="540" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#3D2B1F">Role-Based Prompting</text>

  <!-- Subtitle -->
  <text x="540" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#8B5E3C" font-style="italic">Turn Claude into Any Expert You Need</text>

  <!-- divider -->
  <line x1="340" y1="282" x2="740" y2="282" stroke="#D9C7A8" stroke-width="2"/>

