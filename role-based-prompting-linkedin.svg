    <rect x="451" y="648" width="177" height="212" rx="16" fill="#FFFFFF" stroke="#D9C7A8" stroke-width="1.5"/>
    <circle cx="539.5" cy="722" r="42" fill="#EDE1CC" stroke="#CC785C" stroke-width="2"/>
    <text x="539.5" y="730" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#A6472C">HR</text>
    <text x="539.5" y="800" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#3D2B1F">HR Manager</text>
    <text x="539.5" y="826" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8B5E3C">People &amp; policy</text>
