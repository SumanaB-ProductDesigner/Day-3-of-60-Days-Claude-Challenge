  <text x="290" y="376" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#5C4530">Without Role Prompt</text>

  <rect x="570" y="330" width="440" height="76" rx="14" fill="#F1DFD3" stroke="#CC785C" stroke-width="1.5"/>
  <text x="790" y="376" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#A6472C">With Role Prompt</text>

  <!-- VS circle -->
  <circle cx="540" cy="368" r="32" fill="#3D2B1F"/>
  <text x="540" y="376" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F7F1E6">VS</text>

  <!-- Down arrows -->
  <line x1="290" y1="410" x2="290" y2="448" stroke="#8B5E3C" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="790" y1="410" x2="790" y2="448" stroke="#CC785C" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Outcome boxes -->
