  <text x="290" y="505" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#6B5C46">Generic Answer</text>

  <rect x="570" y="454" width="440" height="88" rx="14" fill="#CC785C" stroke="#A6472C" stroke-width="2"/>
  <text x="790" y="505" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#FBEFE9">Expert-Level Answer</text>

