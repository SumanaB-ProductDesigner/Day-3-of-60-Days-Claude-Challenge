    <text x="736.5" y="730" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#A6472C">CEO</text>
    <text x="736.5" y="800" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#3D2B1F">Founder</text>
    <text x="736.5" y="826" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8B5E3C">Vision &amp; growth</text>
